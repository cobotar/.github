name: Feature
description: New capability or an improvement to an existing one
type: Feature
projects: ["cobotar/1"]
body:
  - type: textarea
    id: why
    attributes:
      label: Why
      description: The problem or scenario this solves. Who benefits (author, operator, robot integrator)?
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What
      description: The proposed behaviour. Sketches, proto snippets and examples are welcome.
    validations:
      required: true
  - type: checkboxes
    id: repos
    attributes:
      label: Affected repos
      description: If more than one is ticked, create sub-issues in the other repos and link them to this issue.
      options:
        - label: protocol
        - label: Authoring
        - label: web-cobotar
        - label: HoloCobotAR
        - label: Fusion360Exporter
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: Concrete acceptance criteria.
